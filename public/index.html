<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Site - Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log-container { border: 1px solid #ccc; padding: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Game Site Dashboard</h1>

    <div>
        <button onclick="registerVisit()">Simulate Visit</button>
        <button onclick="simulatePlayerCollect()">Simulate Player Collect</button>
        <button onclick="generateQR()">Generate QR</button>
    </div>

    <div id="qr-container" style="margin-top: 20px;"></div>

    <h2>Live Logs</h2>
    <div id="logs" class="log-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const logsDiv = document.getElementById('logs');
        const qrContainer = document.getElementById('qr-container');

        // Log helper
        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.prepend(entry);
        }

        // Socket events
        socket.on('connect', () => {
            addLog('Connected to server');
        });

        socket.on('visitor-log', (data) => {
            addLog(`👀 Visitor: IP=${data.ip}, UA=${data.userAgent}`);
        });

        socket.on('player-registered', (data) => {
            addLog(`🎮 Player: IP=${data.ip}, Lat=${data.latitude}, Lon=${data.longitude}`);
        });

        // API calls
        async function registerVisit() {
            try {
                await fetch('/visit', { method: 'POST' });
            } catch (err) {
                console.error(err);
            }
        }

        async function simulatePlayerCollect() {
            try {
                await fetch('/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: 48.8566,
                        longitude: 2.3522,
                        accuracy: 10
                    })
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function generateQR() {
            const url = 'https://example.com';
            qrContainer.innerHTML = `<img src="/qr?url=${encodeURIComponent(url)}" alt="QR Code" />`;
        }

        // Auto-register visit on load
        registerVisit();
    </script>
</body>
</html>
