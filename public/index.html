<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit Video Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎥 LiveKit Video Room</h1>
        
        <div id="preJoin" class="section">
            <h2>Join a Room</h2>
            <div class="form-group">
                <label for="roomName">Room Name:</label>
                <input type="text" id="roomName" placeholder="Enter room name" value="test-room">
            </div>
            <div class="form-group">
                <label for="userName">Your Name:</label>
                <input type="text" id="userName" placeholder="Enter your name">
            </div>
            <button id="joinBtn" class="btn btn-primary">Join Room</button>
        </div>

        <div id="room" class="section" style="display: none;">
            <div class="room-header">
                <h2>Room: <span id="currentRoom"></span></h2>
                <button id="leaveBtn" class="btn btn-danger">Leave Room</button>
            </div>
            
            <div id="videoGrid" class="video-grid"></div>
            
            <div class="controls">
                <button id="toggleVideo" class="btn btn-control">📹 Video</button>
                <button id="toggleAudio" class="btn btn-control">🎤 Audio</button>
                <button id="shareScreen" class="btn btn-control">🖥️ Share Screen</button>
            </div>

            <div class="participants">
                <h3>Participants (<span id="participantCount">0</span>)</h3>
                <ul id="participantList"></ul>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
